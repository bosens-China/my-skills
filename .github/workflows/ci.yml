name: CI

on:
  push:
    branches:
      - main
    paths:
      - packages/file-line-audit/**
      - packages/git-step-commit-memory/**
      - skills/**
      - platforms/**
      - scripts/build-platform-plugins.mjs
      - scripts/validate-platform-plugins.mjs
      - package.json
      - .agents/plugins/marketplace.json
      - .cursor-plugin/marketplace.json
      - .claude-plugin/marketplace.json
      - plugins/yliu-skills/**
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - packages/file-line-audit/**
      - packages/git-step-commit-memory/**
      - skills/**
      - platforms/**
      - scripts/build-platform-plugins.mjs
      - scripts/validate-platform-plugins.mjs
      - package.json
      - .agents/plugins/marketplace.json
      - .cursor-plugin/marketplace.json
      - .claude-plugin/marketplace.json
      - plugins/yliu-skills/**
      - .github/workflows/ci.yml
  workflow_dispatch:

# 并发控制：如果同一分支有新的任务启动，则取消正在运行的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/file-line-audit/go.mod
          cache: true # 开启 Go 依赖缓存
          cache-dependency-path: packages/file-line-audit/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test file-line-audit
        working-directory: packages/file-line-audit
        run: go test -v ./...

      - name: Test git-step-commit-memory
        working-directory: packages/git-step-commit-memory
        run: go test -v ./...

      - name: Build multi-platform plugin
        run: npm run plugins:build

      - name: Validate multi-platform plugin
        run: npm run plugins:check

  refresh-generated-files:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 获取完整历史以支持推送

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/file-line-audit/go.mod
          cache: true
          cache-dependency-path: packages/file-line-audit/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Rebuild packaged binaries
        run: |
          chmod +x ./packages/file-line-audit/scripts/build-skill.sh
          chmod +x ./packages/git-step-commit-memory/scripts/build-skill.sh
          ./packages/file-line-audit/scripts/build-skill.sh
          ./packages/git-step-commit-memory/scripts/build-skill.sh

      - name: Rebuild multi-platform plugin
        run: |
          base_version="$(node -p "require('./package.json').version.split('+')[0]")"
          plugin_version="${base_version}+git.${GITHUB_SHA::12}"
          node scripts/build-platform-plugins.mjs --version "${plugin_version}"
          node scripts/validate-platform-plugins.mjs

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 提交二进制文件和多平台插件生成结果
          git add .
          
          # 检查是否有文件变更
          if git diff --cached --quiet; then
            echo "No changes to commit. Skipping."
            exit 0
          fi
          
          git commit -m "chore(ci): refresh generated files [skip ci]"
          
          # 此时工作区已干净，可以安全地 rebase
          git pull --rebase origin main
          git push origin main
